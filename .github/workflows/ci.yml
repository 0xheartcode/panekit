name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install multiplexers (tmux, screen, zellij)
        run: |
          sudo apt-get update && sudo apt-get install -y tmux screen
          # zellij has no apt package; pull the static release binary.
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin zellij
          tmux -V && screen --version | head -1 && zellij --version

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny

      - name: make check
        run: make check

      - name: make test-pty
        run: make test-pty

      - name: make audit
        run: make audit

      - name: make package
        run: make package
